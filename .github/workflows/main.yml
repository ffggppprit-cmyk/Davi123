
name: Build TNT V2.9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Arquivos do repositorio:"
          ls -la
          unzip -o TNT-V2.9-Android-GitHub.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar projeto
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERRO: projeto Gradle nao encontrado dentro do ZIP."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          gradle -p "$DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TNT-V2.9-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
