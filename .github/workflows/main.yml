
name: Build TNT V2.9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o TNT-V2.9-Android-GitHub.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Localizar projeto Android
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERRO: o ZIP não contém um projeto Gradle Android reconhecível."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TNT-V2.9-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
